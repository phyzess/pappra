<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Pappra keeps a task alive after the session ends</title>
  <desc id="desc">One agent session ends, the task does not: its goal, decisions and next step stay as plain files in the project, and any agent can resume them. An excerpt of real pappra resume output, framed as a hand-off from session A to session B, shows context complete, execution not allowed, and the next step to write the first test.</desc>

  <rect width="1200" height="460" rx="24" fill="#F0F0EE"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <rect x="56" y="44" width="329" height="34" rx="17" fill="none" stroke="#8F8E86" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="76" y="67" font-size="16" font-weight="600" letter-spacing="1.6" fill="#5A5957">GOAL · DECISIONS · NEXT STEP</text>

    <text x="53" y="184" font-size="96" font-weight="800" letter-spacing="-3" fill="#1F1E1C">Pappra</text>

    <g font-size="24" fill="#4A4946">
      <text x="56" y="244">When an agent session ends,</text>
      <text x="56" y="276">the task does not. Its goal, decisions</text>
      <text x="56" y="308">and next step stay in your project</text>
      <text x="56" y="340">as plain files any agent can resume.</text>
    </g>

    <line x1="56" y1="368" x2="600" y2="368" stroke="#C0BFB7" stroke-width="1.5"/>
    <text x="56" y="400" font-size="16" font-weight="600" letter-spacing="1.8" fill="#727270">@PHYZESS/PAPPRA · NODE 24+ · GIT · MIT</text>
  </g>

  <g id="handoff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="18">
    <text x="640" y="60" font-weight="600" fill="#727270">SESSION A</text>
    <line x1="752" y1="54" x2="776" y2="54" stroke="#8F8E86" stroke-width="1.5"/>
    <path d="M770 48 L776 54 L770 60" fill="none" stroke="#8F8E86" stroke-width="1.5"/>
    <text x="790" y="60" font-weight="700" fill="#1F1E1C">.pappra/local/</text>
    <line x1="936" y1="54" x2="960" y2="54" stroke="#8F8E86" stroke-width="1.5"/>
    <path d="M954 48 L960 54 L954 60" fill="none" stroke="#8F8E86" stroke-width="1.5"/>
    <text x="974" y="60" font-weight="600" fill="#727270">SESSION B</text>
  </g>

  <g id="project-proof">
    <rect x="640" y="96" width="504" height="330" rx="24" fill="#1F1E1C"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
      <text x="672" y="136" font-size="20" fill="#F0F0EE"><tspan fill="#8F8E86">$</tspan> pappra resume demo</text>

      <text x="672" y="182" font-size="20" font-weight="600" fill="#A9A8A0">Execution allowed: no</text>

      <g font-size="20" fill="#A9A8A0">
        <text x="672" y="224">Context: complete</text>
        <text x="672" y="256">Code drift: unchanged</text>
        <text x="672" y="288">Verification: current</text>
        <text x="672" y="320">Objective: Try Pappra</text>
      </g>

      <text x="672" y="344" font-size="18" fill="#6E6C68">…</text>
      <text x="1112" y="344" text-anchor="end" font-size="16" font-weight="600" letter-spacing="1.2" fill="#6E6C68">LINES OMITTED</text>
    </g>

    <path d="M640 364 H1144 V402 A24 24 0 0 1 1120 426 H664 A24 24 0 0 1 640 402 Z" fill="#F0F0EE"/>
    <rect x="668" y="382" width="5" height="26" rx="2.5" fill="#BE4020"/>
    <text x="690" y="404" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="20" font-weight="700" fill="#BE4020">Next: Write the first test</text>
    <text x="1118" y="402" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="16" font-weight="600" letter-spacing="1.4" fill="#727270">HAND-OFF</text>
  </g>
</svg>
