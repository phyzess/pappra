<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">From one session to the next</title>
  <desc id="desc">Four steps. Session A works as usual and saves a checkpoint. The task's state becomes files under .pappra/local/, where tasks/demo/ holds task-context.json, latest.json and checkpoints. A new session, in any agent, opens those files with pappra resume. You and the agent then read the hand-off and decide what to run, because a resume reports state and never grants permission to execute.</desc>

  <rect width="1200" height="560" rx="24" fill="#F0F0EE"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="56" y="68" font-size="34" font-weight="800" letter-spacing="-0.6" fill="#1F1E1C">From one session to the next</text>
    <text x="56" y="100" font-size="20" fill="#5A5957">A checkpoint is a file. Any agent can resume it.</text>
  </g>

  <!-- sequence spine -->
  <line x1="84" y1="160" x2="1116" y2="160" stroke="#C0BFB7" stroke-width="1.5"/>
  <g stroke="#8F8E86" stroke-width="1.5" fill="none">
    <path d="M314 154 L320 160 L314 166"/>
    <path d="M594 154 L600 160 L594 166"/>
    <path d="M874 154 L880 160 L874 166"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="20" font-weight="700" text-anchor="middle">
    <circle cx="180" cy="160" r="20" fill="#F0F0EE" stroke="#1F1E1C" stroke-width="1.5"/>
    <circle cx="460" cy="160" r="20" fill="#F0F0EE" stroke="#1F1E1C" stroke-width="1.5"/>
    <circle cx="740" cy="160" r="20" fill="#F0F0EE" stroke="#1F1E1C" stroke-width="1.5"/>
    <circle cx="1020" cy="160" r="20" fill="#F5572F" stroke="#F5572F" stroke-width="1.5"/>
    <g fill="#1F1E1C">
      <text x="180" y="167">1</text>
      <text x="460" y="167">2</text>
      <text x="740" y="167">3</text>
    </g>
    <text x="1020" y="167" fill="#F0F0EE">4</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" font-weight="700" letter-spacing="1.2" fill="#5A5957" text-anchor="middle">
    <text x="180" y="204">SESSION A</text>
    <text x="460" y="204">YOUR PROJECT</text>
    <text x="740" y="204">SESSION B · ANY AGENT</text>
    <text x="1020" y="204">YOU + THE AGENT</text>
  </g>

  <!-- 1 · session A -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="20" fill="#2E2D2A">
    <text x="56" y="232">You and your agent</text>
    <text x="56" y="260">work in a session</text>
    <text x="56" y="288">as usual.</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" fill="#5A5957">
    <text x="56" y="326"><tspan fill="#8F8E86">$</tspan> pappra checkpoint \</text>
    <text x="56" y="348">  --task demo</text>
  </g>

  <!-- 2 · the files -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="20" fill="#2E2D2A">
    <text x="336" y="232">The task becomes files:</text>
  </g>
  <rect x="336" y="280" width="248" height="160" rx="16" fill="#E7E7E3"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" fill="#5A5957">
    <text x="348" y="304" font-weight="700" fill="#1F1E1C">.pappra/local/</text>
    <text x="348" y="328">└ tasks/demo/</text>
    <text x="368" y="352">├ task-context.json</text>
    <text x="368" y="376">├ latest.json</text>
    <text x="368" y="400">└ checkpoints/</text>
    <text x="388" y="424">0001-….json</text>
  </g>

  <!-- 3 · session B -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="20" fill="#2E2D2A">
    <text x="616" y="232">A new session, in any</text>
    <text x="616" y="260">agent, opens the files:</text>
  </g>
  <rect x="616" y="280" width="248" height="160" rx="16" fill="#1F1E1C"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="17">
    <text x="632" y="350" fill="#F0F0EE"><tspan fill="#8F8E86">$</tspan> pappra resume demo</text>
    <text x="632" y="376" fill="#A9A8A0">Context: complete</text>
  </g>

  <!-- 4 · you two decide -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="20" fill="#2E2D2A">
    <text x="896" y="232">You and the agent read</text>
    <text x="896" y="260">the hand-off and decide</text>
    <text x="896" y="288">what to run.</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" fill="#5A5957">
    <text x="896" y="326">Execution allowed: no</text>
    <text x="896" y="348">Next: Write the first test</text>
  </g>

  <!-- the one promise -->
  <line x1="56" y1="468" x2="1144" y2="468" stroke="#C0BFB7" stroke-width="1.5"/>
  <circle cx="64" cy="496" r="9" fill="#F5572F"/>
  <text x="88" y="504" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="22" font-weight="700" fill="#1F1E1C">A resume reports state. It never grants permission to execute.</text>
</svg>
