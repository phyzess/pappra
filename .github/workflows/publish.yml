name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Assert npm CLI supports trusted publishing
        run: |
          node --input-type=module -e "
          import { execFileSync } from 'node:child_process';
          const raw = execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim();
          const [major, minor, patch] = raw.split('.').map(Number);
          const ok = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
          if (!ok) {
            console.error('npm ' + raw + ' is older than 11.5.1; trusted publishing is unavailable.');
            process.exit(1);
          }
          console.log('npm ' + raw);
          "
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run project checks
        run: pnpm check
      - name: Assert the tag matches the package version
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "Tag $tag does not match package version $version." >&2
            exit 1
          fi
      - name: Publish to npm
        run: |
          version="$(node -p "require('./package.json').version")"
          case "$version" in
            *-*) dist_tag=beta ;;
            *) dist_tag=latest ;;
          esac
          npm publish --access public --tag "$dist_tag"
