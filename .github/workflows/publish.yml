name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      dist-tag: ${{ steps.metadata.outputs.dist-tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Assert release commit belongs to main
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run project checks
        run: pnpm check
      - name: Assert the tag matches the package version
        id: metadata
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "Tag $tag does not match package version $version." >&2
            exit 1
          fi
          case "$version" in
            *-*) dist_tag=beta ;;
            *) dist_tag=latest ;;
          esac
          echo "dist-tag=$dist_tag" >> "$GITHUB_OUTPUT"
      - name: Pack the checked build
        run: |
          mkdir release
          npm pack --ignore-scripts --pack-destination release
          mv release/*.tgz release/package.tgz
      - name: Upload the checked package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-package
          path: release/package.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Assert npm CLI supports trusted publishing
        run: |
          node --input-type=module -e "
          import { execFileSync } from 'node:child_process';
          const raw = execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim();
          const [major, minor, patch] = raw.split('.').map(Number);
          const ok = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
          if (!ok) {
            console.error('npm ' + raw + ' is older than 11.5.1; trusted publishing is unavailable.');
            process.exit(1);
          }
          console.log('npm ' + raw);
          "
      - name: Download the checked package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-package
          path: release
      - name: Publish to npm
        env:
          DIST_TAG: ${{ needs.check.outputs.dist-tag }}
        run: npm publish ./release/package.tgz --ignore-scripts --access public --tag "$DIST_TAG"
