name: Bootstrap publish (one-off)

# Temporary workflow. npm only accepts a Trusted Publisher configuration for a
# package that already exists, so the very first publish uses a granular access
# token. After that first publish succeeds:
#   1. delete this workflow,
#   2. delete the NPM_TOKEN repository secret,
#   3. revoke the token on npmjs.com,
#   4. attach the Trusted Publisher for publish.yml and release through it.
# Normal releases use publish.yml only.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type publish to confirm the one-off bootstrap publish
        required: true

permissions:
  contents: read

jobs:
  bootstrap:
    if: inputs.confirm == 'publish'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Assert the bootstrap token is configured
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN repository secret is missing." >&2
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run project checks
        run: pnpm check
      - name: Assert the version is a prerelease
        run: |
          version="$(node -p "require('./package.json').version")"
          case "$version" in
            *-*) echo "Bootstrap publish version $version." ;;
            *)
              echo "Bootstrap publish expects a prerelease version; got $version." >&2
              exit 1
              ;;
          esac
      - name: Publish with the bootstrap token
        run: npm publish --access public --tag beta
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
